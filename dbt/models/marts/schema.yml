version: 2

models:
  - name: mart_property_listing
    description: "Core analytical listing mart"
    columns:
      - name: property_id
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null
      - name: surface_m2
        tests:
          - not_null

  - name: mart_neighborhood_market
    description: "Neighborhood intelligence mart"
    columns:
      - name: neighborhood_id
        tests:
          - unique
          - not_null
      - name: active_listings_count
        tests:
          - not_null

  - name: mart_property_valuation
    description: "Machine learning valuation analysis mart"
    columns:
      - name: property_id
        tests:
          - unique
          - not_null
      - name: valuation_status
        tests:
          - not_null
          - accepted_values:
              values: ['Below model estimate', 'Near model estimate', 'Above model estimate']
